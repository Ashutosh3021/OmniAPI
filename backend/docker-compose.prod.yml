# Production stack — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Set secrets via .env (never commit). Redis is not exposed to the host.

version: "3.9"

services:
  api:
    restart: always
    environment:
      PYRONITES_URL: ${PYRONITES_URL}
      PYRONITES_KEY: ${PYRONITES_KEY}
      PYRONITES_PROJECT_ID: ${PYRONITES_PROJECT_ID}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ENVIRONMENT: production
      DEBUG: "False"
    expose:
      - "8000"
    profiles: []

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: always

  celery_external:
    restart: always

  celery_webhooks:
    restart: always

  celery_maintenance:
    restart: always

  celery_beat:
    restart: always

  redis:
    restart: always
    volumes:
      - redis_data:/data
    # Evict rather than error when the cache fills up. The default
    # noeviction policy turns a cache flood into Redis write errors, and the
    # rate limiter shares this instance — which would break authentication.
    command: >
      redis-server --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    ports: []

volumes:
  redis_data:
