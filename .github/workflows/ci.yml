name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The data store is a remote HTTP service in production. The suite runs
      # against an in-process SQLite client that speaks the same contract, so
      # the real SQL — constraints, cascades, CHECKs — is still exercised.
      PYRONITES_URL: http://localhost:8000
      PYRONITES_KEY: ci-test-key
      PYRONITES_PROJECT_ID: omniapi_ci
      REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret-key-minimum-sixteen
      ENCRYPTION_KEY: 9Y20clgis-akygxJdmMjEt4pzSqz3JJH7brY2wvsZPU=
      ALLOWED_ORIGINS: http://localhost:3000
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests with coverage
        working-directory: backend
        run: pytest --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  integration:
    # The distributed path: a real broker, a real worker, a real result
    # backend. The unit suite runs Celery eagerly with an in-memory backend,
    # so the worker pool, the queue routing and the round trip are only
    # exercised here.
    runs-on: ubuntu-latest
    needs: test

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYRONITES_URL: http://localhost:8000
      PYRONITES_KEY: ci-test-key
      PYRONITES_PROJECT_ID: omniapi_ci
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-sixteen
      ENCRYPTION_KEY: 9Y20clgis-akygxJdmMjEt4pzSqz3JJH7brY2wvsZPU=
      ALLOWED_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The worker must run on a real pool. The `solo` pool that used to be
      # hard-coded in the app config is what made every deployment
      # single-threaded, and it is invisible to an eagerly-executed suite.
      - name: Start a Celery worker
        working-directory: backend
        run: |
          celery -A app.tasks.celery_app worker -Q webhooks --concurrency=2 --loglevel=info &
          for i in $(seq 1 30); do
            if celery -A app.tasks.celery_app inspect ping 2>/dev/null | grep -q pong; then
              echo "worker ready"
              break
            fi
            sleep 1
          done

      - name: Run the integration suite
        working-directory: backend
        run: pytest tests/integration -v

      - name: Report the worker pool
        working-directory: backend
        run: celery -A app.tasks.celery_app inspect stats
